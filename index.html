<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夜市好好逛</title><style>
:root{--ink:#382820;--paper:#fffdf8;--red:#b74d3a;--gold:#d89531;--line:#ead6bb;--shadow:0 16px 35px rgba(74,43,28,.16)}*{box-sizing:border-box}body{margin:0;min-width:320px;color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(135deg,#fff1d8,#ffe5bd)}button{font:inherit;cursor:pointer}.app{min-height:100vh;max-width:1450px;margin:auto;padding:clamp(14px,2.5vw,34px)}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}h1{margin:0;font-size:clamp(27px,4vw,44px);letter-spacing:.1em;font-family:serif}.counter{font-weight:900;background:#fff8eb;border:1px solid #e8c99d;border-radius:999px;padding:9px 14px}.counter b{color:var(--red);font-size:21px}.game{min-height:calc(100vh - 135px);display:grid;place-items:center;padding:clamp(18px,4vw,62px);border-radius:28px;background:linear-gradient(90deg,rgba(46,29,22,.78),rgba(46,29,22,.26)),url('assets/night-market-hero.png') center/cover;box-shadow:var(--shadow)}.card{width:min(900px,100%);background:rgba(255,253,248,.96);border:7px solid rgba(255,248,232,.8);border-radius:24px;padding:clamp(25px,5vw,56px);text-align:center;box-shadow:0 15px 0 rgba(80,43,26,.2)}.sign{display:inline-block;background:var(--red);color:#fff9e7;padding:8px 18px;border-radius:7px;font-weight:900;letter-spacing:.12em;box-shadow:4px 4px 0 #7f3028}.label{margin:30px 0 13px;color:#8b6654;font-size:16px;font-weight:800;letter-spacing:.14em}.riddle{margin:auto;max-width:720px;font-family:serif;font-weight:900;font-size:clamp(28px,4.5vw,53px);line-height:1.55;white-space:pre-line}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:33px}.button{border:0;border-radius:11px;padding:14px 22px;font-weight:900;color:#643a2d;background:#fff3dd;box-shadow:0 4px 0 #e5c49e}.button.primary{color:#fff;background:var(--red);box-shadow:0 4px 0 #873128}.button:active{transform:translateY(2px);box-shadow:none}.answer{display:none;margin:30px auto 0;max-width:620px;border-top:2px dashed var(--line);padding-top:25px}.revealed .answer{display:block}.answer h2{font-family:serif;font-size:clamp(35px,5vw,57px);margin:0;color:var(--red)}.answer p{font-weight:700;font-size:18px}.reset{position:fixed;right:18px;bottom:18px;border:0;background:rgba(255,253,248,.9);color:#795541;border-radius:9px;padding:9px 12px;font-weight:800}@media(max-width:620px){header{align-items:flex-start;flex-direction:column}.game{padding:16px;min-height:calc(100vh - 150px)}.card{padding:27px 18px}.riddle{font-size:29px}.actions{margin-top:25px}}
</style></head><body><main class="app"><header><h1>夜市好好逛</h1><div class="counter">已猜 <b id="count">0</b> / <span id="total">0</span> 題</div></header><section class="game"><article class="card" id="card"><span class="sign">夜市猜謎</span><p class="label" id="label">看完謎語，猜猜是什麼小吃？</p><div class="riddle" id="riddle"></div><div class="answer"><h2 id="answer"></h2><p id="tip"></p></div><div class="actions"><button class="button primary" id="reveal">揭曉答案</button><button class="button" id="next" hidden>下一題</button></div></article></section></main><button class="reset" id="reset">重新開始</button><script>
(()=>{const KEY='night-market-riddles-v5',items=[['bubble-tea','珍珠奶茶','不向深海尋寶藏，\n黑玉成群水底藏。\n葉香借得一身雪，\n飲罷仍須齒幫忙。','茶香、奶香與黑色珍珠，是臺灣代表性的手搖飲。'],['stinky-tofu','臭豆腐','聞起來很有個性，\n外皮炸得金黃香。\n常和泡菜做朋友，\n愛吃的人說真棒。','外酥內嫩，常搭配泡菜一起吃。'],['oyster-omelet','蚵仔煎','海裡小客人來作伴，\n雞蛋青菜一起煎。\n透明 Q 皮裹住鮮，\n夜市招牌大家饞。','蚵仔、雞蛋與粉漿煎出的經典夜市小吃。'],['gua-bao','刈包','白白麵皮像虎口，\n滷肉酸菜躲裡頭。\n花生粉來添香氣，\n一口咬下好滿足。','鬆軟麵皮夾著滷肉、酸菜與花生粉。'],['ox-tongue-cake','牛舌餅','名字聽來像動物，\n其實櫥窗裡靜靜躺。\n扁長薄脆帶甜香，\n蘭陽旅行常帶上。','宜蘭常見的薄脆甜餅；鹿港也有口感較厚實的同名點心。'],['sun-cake','太陽餅','不是天上那一顆，\n圓圓酥皮掌心托。\n中間藏著麥芽甜，\n臺中旅行常帶走。','臺中著名的麥芽酥餅。'],['makau-sausage','馬告香腸','不是胡椒也非蒜，\n山林綠果磨成香。\n黑亮肉腸火上轉，\n一口像有檸薑來。','馬告是原住民族常用的山胡椒香料，帶有清新的檸檬與薑香。'],['bamboo-rice','竹筒飯','竹子不是拿來吹，\n米飯躲進肚子裡。\n火邊等到香氣出，\n剖開才見白米粒。','將米與食材裝進竹筒烹煮的風味米食；各地作法不同。'],['millet-donut','小米甜甜圈','不是麵粉排第一，\n小小穀粒磨成團。\n中間留個圓圓洞，\n炸成金環香又暖。','以小米製作的甜甜圈，是部落市集常見的點心。'],['pepper-bun','胡椒餅','肚藏碎肉與青翠，\n白點撒落覆金衣。\n不臥鍋底貼爐壁，\n咬開辛香暖舌尖。','爐壁烤出的芝麻餅皮，裡面包著胡椒香濃的豬肉與青蔥。'],['candied-hawthorn','糖葫蘆','一群紅臉小姑娘，\n沿著竹竿排成行。\n身穿透明水晶衣，\n咬破甜衣酸味藏。','紅色山楂串上竹籤，外層裹著晶亮糖衣的街頭甜點。'],['oyster-fritter','蚵嗲','小小圓餅下油鍋，\n韭菜蚵仔藏其中。\n不是煎蛋也非肉圓，\n咬時海味燙呼呼。','以蚵仔、韭菜等食材裹粉油炸，是臺灣西南沿海常見的小吃。'],['tube-rice-cake','筒仔米糕','一只小杯裝白米，\n蒸好倒扣像小塔。\n肉香不在表面說，\n翻開才懂它的名字。','以小容器蒸熟的米糕，常搭配肉燥與配料。'],['rice-pudding','碗粿','米漿靜靜坐成碗，\n蒸過像白玉果凍。\n不端去喝也非甜品，\n醬料一淋才開場。','用米漿蒸成的米食，常配肉燥、菜脯或醬料。'],['fried-twins','雙胞胎','兩個圓胖手牽手，\n一起下鍋變金黃。\n不是甜甜圈有洞，\n早餐攤前常飄香。','臺灣常見的油炸麵點，兩團麵糰相連，外酥內軟。'],['white-sugar-cake','白糖粿','白胖長條滾熱油，\n出鍋穿上糖粉衣。\n不是油條也非麻糬，\n南方點心有香氣。','南臺灣常見的糯米油炸點心，外層常沾糖與花生粉。'],['taichung-noodle-soup','大麵羹','名字有麵卻不長，\n湯頭濃得像雲霧。\n菜脯胡椒悄悄放，\n中部早餐有人顧。','臺中特色小吃，麵條短而寬，常搭配菜脯與韭菜。'],['yilan-bu-rou','卜肉','名字像是問吉凶，\n真正答案會噴香。\n薄肉穿上麵衣後，\n蘭陽油鍋變金黃。','宜蘭小吃，將豬肉裹粉油炸，常與蒜苗一起享用。'],['lugang-vermicelli','鹿港麵線糊','細線藏進濃濃湯，\n湯匙不必拿筷子。\n老街清晨一碗暖，\n港邊古鎮有人吃。','彰化鹿港常見的早點，細麵線煮成濃稠羹湯。'],['hsinchu-meatball','新竹貢丸','不是肉圓有外衣，\n豬肉敲打變成丸。\n清湯麵裡常看見，\n新竹名字最有關。','新竹著名的彈牙豬肉丸。'],
['cube-cracker','方塊酥','小小身體四四方，\n一層一層藏酥香。\n不是骰子不能玩，\n嘉義伴手常帶回。','嘉義知名的酥脆點心，外型小巧方正、層次分明。'],['turkey-rice','嘉義火雞肉飯','白飯上頭肉絲細，\n清香油蔥慢慢淋。\n不是雞腿整隻上，\n嘉義早午都相宜。','嘉義最具代表性的火雞肉飯。'],
['danzai-noodles','臺南擔仔麵','小碗麵湯不太深，\n肉燥蝦子坐上頭。\n從前挑擔做生意，\n古城巷口常相逢。','臺南著名的小碗湯麵。'],
['coffin-bread','臺南棺材板','厚片吐司先炸酥，\n挖空肚子盛好料。\n名字聽來有點怕，\n臺南小吃卻很香。','把炸吐司挖空，裝進濃稠餡料的臺南小吃。'],
['hualien-mochi','花蓮麻糬','白白軟軟像雲朵，\n花生紅豆藏心中。\n不是口香糖會黏牙，\n花蓮旅行常帶走。','花蓮常見的 Q 軟伴手禮點心。'],


['keelung-sandwich','基隆營養三明治','名字聽來像正餐，\n卻在夜市排長隊。\n炸開麵包肚子後，\n火腿蔬菜甜白醬。','基隆廟口知名小吃：炸過的長麵包夾入火腿、蔬菜與甜美乃滋。'],['meatball','肉圓','半透明的 Q 外衣，\n肉餡躲在肚子裡。\n常用剪刀剪開吃，\n淋上醬汁真神氣。','以地瓜粉外皮包住餡料的臺灣小吃。']];let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}state??={left:items.map(x=>x[0]),current:null,revealed:false};const $=id=>document.getElementById(id),by=id=>items.find(x=>x[0]===id),save=()=>localStorage.setItem(KEY,JSON.stringify(state));function pick(){if(!state.left.length){$('riddle').textContent='今晚的謎語都猜完了！\n按「重新開始」再玩一局。';$('label').textContent='全數完成';$('reveal').hidden=true;$('next').hidden=true;return}state.current=state.left[Math.floor(Math.random()*state.left.length)];state.revealed=false;save();draw()}function draw(){let x=by(state.current);$('total').textContent=items.length;$('count').textContent=items.length-state.left.length;$('card').classList.toggle('revealed',state.revealed);$('riddle').textContent=x[2];$('answer').textContent=x[1];$('tip').textContent=x[3];$('reveal').hidden=state.revealed;$('next').hidden=!state.revealed}$('reveal').onclick=()=>{state.revealed=true;state.left=state.left.filter(id=>id!==state.current);save();draw()};$('next').onclick=pick;$('reset').onclick=()=>{localStorage.removeItem(KEY);state={left:items.map(x=>x[0]),current:null,revealed:false};pick()};pick()})();
</script></body></html>
